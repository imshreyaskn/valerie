services:
  api:
    build: .
    command: uvicorn valerie.api.main:app --host 0.0.0.0 --port 8080 --reload
    volumes: 
      - ./src:/app/src
      - ./resources:/app/resources
    env_file: .env
    ports: 
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: uvicorn valerie.worker.executor:app --host 0.0.0.0 --port 8081
    volumes: 
      - ./src:/app/src
      - ./resources:/app/resources
    env_file: .env
    ports: 
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: valerie_db
      POSTGRES_USER: valerie
      POSTGRES_PASSWORD: localdev
    ports: 
      - "5432:5432"
    volumes: 
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valerie -d valerie_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:

