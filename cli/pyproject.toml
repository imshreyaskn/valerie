[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "valerie-cli"
version = "0.1.0"
description = "BYOK CLI for the Valerie LLM Red-Teaming Platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "pydantic>=2.10.0",
]

[project.scripts]
valerie = "valerie_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["valerie_cli"]
